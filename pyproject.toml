[project]
name = "inforce"
version = "0.1.0"
description = "Cost-aware retrieval router for SEBI Mutual Fund regulatory documents"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "neo4j>=6.3.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"
